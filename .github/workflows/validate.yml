name: Validate local builder

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile-check the builder
        run: python -m py_compile build.py launcher.py scripts/build_sdl2_sdk.py scripts/stage_sdl2_windows.py scripts/stage_recompiler.py

      - name: Test generated runtime enhancement
        run: python -m unittest discover -s tests -v

      - name: Check builder help
        run: python build.py --help

      - name: Check shell launchers
        if: runner.os != 'Windows'
        shell: bash
        run: |
          bash -n build-linux.sh
          bash -n build-macos.sh

      - name: Parse Windows launcher
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Join-Path $PWD "build-windows.ps1"),
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_ }
            exit 1
          }
