name: Build launcher packages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.platform }} launcher
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macOS arm64
            os: macos-26
            artifact: macos
          - platform: Windows x64
            os: windows-latest
            artifact: windows
          - platform: Linux x64
            os: ubuntu-22.04
            artifact: linux
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Linux GUI and AppImage dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libfuse2 libtk8.6 libtcl8.6 \
            libx11-6 libxext6 libxrender1 libxft2 libfontconfig1 \
            libasound2-dev libpulse-dev libx11-dev libxext-dev libxrandr-dev \
            libxcursor-dev libxinerama-dev libxi-dev libxss-dev libxfixes-dev \
            libwayland-dev libxkbcommon-dev libegl1-mesa-dev libgl1-mesa-dev \
            libgles2-mesa-dev libudev-dev libdbus-1-dev libdrm-dev libgbm-dev \
            libdecor-0-dev libibus-1.0-dev

      - name: Verify Python and Tk
        run: python -c "import tkinter, build, launcher; print('Tk and launcher imports OK')"

      - name: Compile-check sources
        run: python -m py_compile build.py launcher.py scripts/build_sdl2_sdk.py scripts/stage_sdl2_windows.py scripts/stage_recompiler.py

      - name: Install pinned bundled build toolchain
        run: python -m pip install --upgrade pip pyinstaller cmake==3.31.10 ninja==1.13.2 ziglang==0.17.1

      - name: Stage CMake, Ninja, and Zig inside launcher bundle
        shell: python
        run: |
          import importlib.util
          import pathlib
          import shutil
          import subprocess
          import sys

          root = pathlib.Path.cwd()
          tools = root / "vendor-tools"
          tools.mkdir(exist_ok=True)

          import cmake
          cmake_data = pathlib.Path(cmake.CMAKE_DATA)
          shutil.copytree(cmake_data, tools / "cmake", dirs_exist_ok=True)

          ninja = shutil.which("ninja")
          if not ninja:
              raise SystemExit("The pinned Ninja package did not install its executable")
          shutil.copy2(ninja, tools / ("ninja.exe" if sys.platform == "win32" else "ninja"))

          zig_spec = importlib.util.find_spec("ziglang")
          if zig_spec is None or zig_spec.origin is None:
              raise SystemExit("The pinned Zig package could not be imported")
          zig_package = pathlib.Path(zig_spec.origin).resolve().parent
          shutil.copytree(zig_package, tools / "ziglang", dirs_exist_ok=True)

          print("Bundled CMake:", tools / "cmake" / "bin")
          print("Bundled Ninja:", tools / ("ninja.exe" if sys.platform == "win32" else "ninja"))
          print("Bundled Zig:", tools / "ziglang")

      - name: Build relocatable SDL2 SDK for macOS and Linux
        if: runner.os != 'Windows'
        run: python scripts/build_sdl2_sdk.py

      - name: Stage official prebuilt SDL2 SDK for Windows
        if: runner.os == 'Windows'
        run: python scripts/stage_sdl2_windows.py

      - name: Bundle the ROM-free GB recompiler
        run: python scripts/stage_recompiler.py

      - name: Preserve third-party toolchain license notices
        shell: python
        run: |
          import importlib.metadata
          import pathlib
          import shutil

          root = pathlib.Path.cwd()
          destination = root / "vendor-tools" / "licenses"
          packages = ("cmake", "ninja", "ziglang", "pyinstaller", "pyinstaller-hooks-contrib", "altgraph")
          copied = 0

          for package_name in packages:
              try:
                  distribution = importlib.metadata.distribution(package_name)
              except importlib.metadata.PackageNotFoundError:
                  continue
              for item in distribution.files or ():
                  relative = pathlib.PurePosixPath(str(item))
                  filename = relative.name.lower()
                  if not (
                      filename.startswith("license")
                      or filename.startswith("copying")
                      or filename.startswith("notice")
                      or filename.startswith("patents")
                  ):
                      continue
                  source = pathlib.Path(distribution.locate_file(item))
                  if not source.is_file():
                      continue
                  target = destination / package_name / pathlib.Path(*relative.parts)
                  target.parent.mkdir(parents=True, exist_ok=True)
                  shutil.copy2(source, target)
                  copied += 1

          if copied == 0:
              raise SystemExit("No bundled toolchain license notices were found")
          print(f"Preserved {copied} third-party license/notice files under {destination}")

      - name: Package desktop launcher with all local build dependencies
        shell: python
        run: |
          import os
          import subprocess
          import sys

          command = [
              sys.executable, "-m", "PyInstaller",
              "--clean", "--noconfirm", "--onefile", "--windowed",
              "--name", "PokemonPinballRecompiled",
              "--add-data", f"vendor-tools{os.pathsep}vendor-tools",
              "launcher.py",
          ]
          subprocess.run(command, check=True)

      - name: Create macOS DMG
        if: runner.os == 'macOS'
        shell: bash
        run: |
          codesign --force --deep --sign - dist/PokemonPinballRecompiled.app
          mkdir -p dist/dmg-root
          cp -R dist/PokemonPinballRecompiled.app dist/dmg-root/
          ln -s /Applications dist/dmg-root/Applications
          hdiutil create \
            -volname "Pokemon Pinball Recompiled" \
            -srcfolder dist/dmg-root \
            -ov -format UDZO \
            dist/PokemonPinballRecompiled-macos-arm64.dmg

      - name: Create Linux AppImage
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p AppDir/usr/bin AppDir/usr/lib
          mkdir -p AppDir/usr/share/applications
          mkdir -p AppDir/usr/share/icons/hicolor/scalable/apps
          cp dist/PokemonPinballRecompiled AppDir/usr/bin/PokemonPinballRecompiled

          cat > AppDir/PokemonPinballRecompiled.desktop <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=Pokémon Pinball Recompiled
          Comment=Build and play from a locally supplied ROM
          Exec=PokemonPinballRecompiled
          Icon=pokemon-pinball-recompiled
          Categories=Game;Emulator;
          Terminal=false
          EOF
          cp AppDir/PokemonPinballRecompiled.desktop AppDir/usr/share/applications/

          cat > AppDir/usr/share/icons/hicolor/scalable/apps/pokemon-pinball-recompiled.svg <<'EOF'
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
            <rect x="12" y="12" width="232" height="232" rx="36" fill="#202a35"/>
            <rect x="42" y="42" width="172" height="132" rx="12" fill="#9bbc0f" stroke="#f0f3d0" stroke-width="8"/>
            <path d="M70 142V74h18l40 44V74h18v68h-17L88 98v44z" fill="#24351f"/>
            <circle cx="177" cy="207" r="15" fill="#e94b55"/>
            <circle cx="143" cy="207" r="15" fill="#e0c34a"/>
          </svg>
          EOF
          cp AppDir/usr/share/icons/hicolor/scalable/apps/pokemon-pinball-recompiled.svg AppDir/pokemon-pinball-recompiled.svg

          cat > AppDir/AppRun <<'EOF'
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "$0")")"
          export LD_LIBRARY_PATH="$HERE/usr/lib:$LD_LIBRARY_PATH"
          exec "$HERE/usr/bin/PokemonPinballRecompiled" "$@"
          EOF
          chmod +x AppDir/AppRun

          python - <<'PY'
          import pathlib
          import re
          import shutil
          import subprocess
          import _tkinter

          output = subprocess.check_output(["ldd", _tkinter.__file__], text=True)
          destination = pathlib.Path("AppDir/usr/lib")
          for line in output.splitlines():
              match = re.search(r"=>\s+(/[^ ]+)", line)
              if not match:
                  continue
              source = pathlib.Path(match.group(1))
              if source.name.startswith(("libtk", "libtcl")) and source.is_file():
                  shutil.copy2(source, destination / source.name)
          PY

          wget -q -O appimagetool.AppImage \
            https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool.AppImage
          ARCH=x86_64 APPIMAGE_EXTRACT_AND_RUN=1 \
            ./appimagetool.AppImage AppDir \
            dist/PokemonPinballRecompiled-linux-x86_64.AppImage

      - name: Upload launcher package
        uses: actions/upload-artifact@v4
        with:
          name: launcher-${{ matrix.artifact }}
          path: |
            dist/PokemonPinballRecompiled-macos-arm64.dmg
            dist/PokemonPinballRecompiled.exe
            dist/PokemonPinballRecompiled-linux-x86_64.AppImage
          if-no-files-found: error
          retention-days: 14

  publish-release:
    name: Publish a release for every successful main build
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all platform packages
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: launcher-*
          merge-multiple: true

      - name: Publish a new release for this build
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: Build #${{ github.run_number }}
          prerelease: false
          draft: false
          make_latest: true
          files: release-assets/*
          body: |
            Automatic desktop launcher release for commit ${{ github.sha }}.

            Every successful main-branch build receives its own release and
            independent asset download counts. Older releases are not replaced.

            These downloads contain the launcher only, not Pokémon Pinball's ROM,
            generated game source, or game executable. Run the launcher and select
            a ROM stored locally on your own computer to generate your own build.

            The game runtime provides fullscreen display output, scaling modes,
            the optional Widescreen Backdrop, pixel/linear filters, V-Sync,
            audio controls, speed controls, save states, overlays, and input
            remapping. 8K output is host display upscaling of the original
            160x144 Game Boy frame.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
